<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maaf ya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Poppins,"Segoe UI",system-ui,sans-serif;color:#fff;overflow:hidden;
 background:linear-gradient(#d9f1ff 0%,#6cb8f0 35%,#1d6fc4 75%,#0b3f86 100%);
 display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}
.sand{position:fixed;left:-10%;right:-10%;bottom:-6%;height:20%;background:radial-gradient(ellipse at 50% 0,#2a7fd0 0,#0e4d9a 70%);border-radius:50% 50% 0 0;opacity:.8}
.fish{position:fixed;font-size:1.6rem;opacity:.55;animation:bob 6s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translate(14px,-18px)}}
@keyframes swim{0%{transform:translateX(-26px) rotate(-8deg)}50%{transform:translateX(26px) translateY(-10px) rotate(8deg)}100%{transform:translateX(-26px) rotate(-8deg)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.7}100%{transform:translateY(-95vh) translateX(20px) scale(1.2);opacity:0}}
.fish.bub{top:auto!important;bottom:-8%;animation:rise 9s linear infinite}
@keyframes pop{from{transform:scale(0) rotate(-25deg);opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-9px) rotate(7deg)}}
@keyframes spin{to{transform:rotate(360deg) scale(1.25)}}
@keyframes heart{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),-70vh) scale(1.4) rotate(var(--r));opacity:0}}
.stk{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;cursor:pointer}
.em{display:inline-block;transform-origin:50% 90%;animation:bounce 1.8s ease-in-out infinite}
.stk.hop .em{animation:spin .6s ease}
.pf{position:fixed;left:50%;top:55%;z-index:9;font-size:1.7rem;pointer-events:none;animation:heart 1.8s ease-out forwards}
#app{position:relative;z-index:2;width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center}
.stk{width:104px;height:104px;border-radius:20px;background:#fff;box-shadow:0 6px 18px #0003;display:flex;align-items:center;justify-content:center;font-size:3.4rem;margin-bottom:14px;overflow:hidden}
.stk img{width:100%;height:100%;object-fit:cover}
h1{font-family:"Great Vibes","Brush Script MT",cursive;font-weight:400;font-size:2.4rem;margin:.1em 0 .3em;text-shadow:0 2px 8px #0005}
p{margin:.3em 0 1em;font-size:.88rem;line-height:1.55;text-shadow:0 1px 4px #0004;white-space:pre-wrap}
.btns{display:flex;gap:12px;justify-content:center;min-height:56px;align-items:flex-start}
button{font:inherit;font-weight:600;font-size:.85rem;background:#0a78c8;color:#fff;border:0;border-radius:9px;padding:9px 22px;cursor:pointer;box-shadow:0 3px 10px #0004;transition:transform .25s}
button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
.letter{background:#ffffff2e;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #ffffff55;border-radius:16px;padding:18px 16px;max-height:70vh;overflow-y:auto;text-align:left;margin-bottom:12px}
.letter p{margin:0;font-size:.82rem}
#mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;padding:7px 10px;border-radius:50%;background:#ffffff40;font-size:1.1rem}
@media (prefers-reduced-motion:reduce){.fish,.em,.stk,.pf{animation:none!important}}
</style>
</head>
<body>
<div class="sand"></div>
<button id="mus" aria-label="Pilih musik" title="Pilih musik dari HP/komputer">🎵</button>
<input type="file" id="pick" accept="audio/*" hidden>
<audio id="au" loop></audio>
<div id="app"></div>

<script>
/* ====== UBAH TEKS & MUSIK DI SINI ====== */
var CONFIG={
 /* Musik: tulis nama file, mis. "lagu.mp3" (taruh sejajar dengan file ini).
    Kosongkan "" kalau mau pilih lewat tombol 🎵 di pojok kanan atas. */
 musik:"lagu.mp3",
 /* "stiker" boleh emoji atau nama file gambar, mis. "stiker1.png" */
 layar1:{stiker:"📦",tombol:"ketuk >"},
 layar2:{stiker:"🥺",judul:"maaf ya, agit",
  teks:"kadang aku menyakiti orang yang paling ngerti aku. halaman ini cara kecilku buat bilang maaf.",
  ya:"iya",tidak:"tidak"},
 layar3:{stiker:"🥹",
  teks:"aku tau aku punya salah dan aku bukan orang yang sempurna. tapi soal salahku ke kamu itu bukan sengaja.",
  tombol:"maafin aku!!"},
 layar4:{
  teks:"maaf yaa caraku memperlakukanmu tadi.\n\naku tau aku selalu buat salah sama kamu, aku minta maaf ya kalo ngerepotin kamu terus. aku mau minta maaf sama kamu untuk hal yang buat kamu badmood tadi tolong maafin ya, ehehe maaf ya kalo terkesan memaksa, minta maaf ya agitku yang lucu.",
  tombol:"Lanjut"},
 layar5:{stiker:"🐰",
  teks:"Terima kasih sudah membaca permintaan maafku. Terima kasih untuk setiap senyummu.",
  tombol:"ulang"}
};
/* ====== SELESAI ====== */

var app=document.getElementById("app"),au=document.getElementById("au");
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function stk(v){return '<div class="stk">'+(/\.(png|jpe?g|gif|webp|svg)$/i.test(v)?'<img src="'+esc(v)+'" alt="">':'<span class="em">'+esc(v)+'</span>')+'</div>'}
function wire(){var k=document.querySelector(".stk");if(k)k.onclick=function(){k.classList.remove("hop");void k.offsetWidth;k.classList.add("hop");setTimeout(function(){k.classList.remove("hop")},650)}}
function burst(e){for(var i=0;i<14;i++){var p=document.createElement("span");p.className="pf";p.textContent=e||"💖";
 p.style.setProperty("--dx",((Math.random()-.5)*300)+"px");p.style.setProperty("--r",((Math.random()-.5)*60)+"deg");
 p.style.animationDelay=(Math.random()*.3)+"s";document.body.appendChild(p);setTimeout(function(x){x.remove()},2400,p)}}
function $(i){return document.getElementById(i)}
function play(){if(au.src&&au.paused)au.play().catch(function(){})}

/* hiasan laut */
(function(){var e=["🐟","🐠","🐙","⭐","🐚","🦀","🫧","🐡","🪸"];
 for(var i=0;i<16;i++){var s=document.createElement("span");s.className="fish";s.textContent=e[i%e.length];
 s.style.left=Math.random()*95+"%";s.style.top=Math.random()*88+"%";s.style.animationDelay=(-Math.random()*6)+"s";
 s.style.fontSize=(1+Math.random()*1.2)+"rem";
 if(e[i%e.length]==="🫧"){s.classList.add("bub");s.style.animationDuration=(7+Math.random()*6)+"s"}
 else if(/🐟|🐠|🐡/.test(e[i%e.length])){s.style.animationName="swim";s.style.animationDuration=(4+Math.random()*5)+"s"}
 document.body.appendChild(s)}
 for(var j=0;j<6;j++){var b=document.createElement("span");b.className="fish bub";b.textContent="🫧";b.style.left=Math.random()*95+"%";
 b.style.animationDelay=(-Math.random()*9)+"s";b.style.animationDuration=(7+Math.random()*6)+"s";document.body.appendChild(b)}})();

/* musik */
if(CONFIG.musik)au.src=CONFIG.musik;
$("mus").onclick=function(){$("pick").click()};
$("pick").onchange=function(e){var f=e.target.files[0];if(!f)return;au.src=URL.createObjectURL(f);au.play().catch(function(){})};

function s1(){var c=CONFIG.layar1;
 app.innerHTML=stk(c.stiker)+'<button id="b">'+esc(c.tombol)+'</button>';
 wire();$("b").onclick=function(){play();s2()}}
function s2(){var c=CONFIG.layar2;
 app.innerHTML=stk(c.stiker)+'<h1>'+esc(c.judul)+'</h1><p>'+esc(c.teks)+'</p><div class="btns"><button id="y">'+esc(c.ya)+'</button><button id="n">'+esc(c.tidak)+'</button></div>';
 wire();$("y").onclick=function(){burst("💖");s3()};
 var n=$("n");function lari(e){if(e)e.preventDefault();
  n.style.transform="translate("+((Math.random()-.5)*150)+"px,"+((Math.random()-.5)*90)+"px)"}
 n.addEventListener("pointerenter",lari);n.addEventListener("pointerdown",lari);n.onclick=lari}
function s3(){var c=CONFIG.layar3;
 app.innerHTML=stk(c.stiker)+'<p>'+esc(c.teks)+'</p><button id="b">'+esc(c.tombol)+'</button>';
 wire();$("b").onclick=function(){burst("🥺");s4()}}
function s4(){var c=CONFIG.layar4;
 app.innerHTML='<div class="letter"><p>'+esc(c.teks)+'</p></div><button id="b">'+esc(c.tombol)+'</button>';
 $("b").onclick=s5}
function s5(){var c=CONFIG.layar5;
 app.innerHTML=stk(c.stiker)+'<p>'+esc(c.teks)+'</p><button id="b">'+esc(c.tombol)+'</button>';
 wire();burst("🎉");$("b").onclick=s1}
s1();
</script>
</body>
</html>
